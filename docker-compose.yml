version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: cloudvault-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: cloudvault
    networks:
      - cloudvault-network

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: cloudvault-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - cloudvault-network

  # MinIO - S3 Compatible Storage (Local Development)
  minio:
    image: minio/minio:latest
    container_name: cloudvault-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    networks:
      - cloudvault-network

  # MinIO Bucket Initialization
  minio-init:
    image: minio/mc:latest
    container_name: cloudvault-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/cloudvault --ignore-existing;
      mc anonymous set download myminio/cloudvault/public;
      echo 'Bucket created successfully';
      exit 0;
      "
    networks:
      - cloudvault-network

  # Backend Server
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    container_name: cloudvault-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./server/src:/app/server/src
      - /app/server/node_modules
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/cloudvault
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev-jwt-secret-change-in-production
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_BUCKET_NAME: cloudvault
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongodb
      - redis
      - minio
    networks:
      - cloudvault-network

  # Background Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    container_name: cloudvault-worker
    restart: unless-stopped
    command: node src/workers/index.js
    volumes:
      - ./server/src:/app/server/src
      - /app/server/node_modules
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongodb:27017/cloudvault
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_BUCKET_NAME: cloudvault
    depends_on:
      - mongodb
      - redis
      - minio
    networks:
      - cloudvault-network

  # Frontend (Dev)
  client:
    build:
      context: .
      dockerfile: Dockerfile
      target: client-dev
    container_name: cloudvault-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./client/src:/app/client/src
      - ./client/public:/app/client/public
      - ./client/index.html:/app/client/index.html
      - /app/client/node_modules
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - server
    networks:
      - cloudvault-network

volumes:
  mongodb_data:
  redis_data:
  minio_data:

networks:
  cloudvault-network:
    driver: bridge
